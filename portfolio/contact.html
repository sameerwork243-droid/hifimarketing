<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>John Kendric - Contact</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0b0f1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .portfolio-card {
            max-width: 1200px;
            width: 100%;
            background: #111827;
            border-radius: 30px;
            padding: 30px 40px 50px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            border: 1px solid #1e293b;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #6c63ff, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            list-style: none;
        }

        .nav-links a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            font-size: 16px;
            transition: 0.3s;
            position: relative;
        }

        .nav-links a:hover {
            color: #fff;
        }

        .nav-links a.active {
            color: #fff;
        }

        .nav-links a.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #6c63ff;
            border-radius: 10px;
        }

        .btn-cv {
            display: inline-block;
            background: linear-gradient(135deg, #6c63ff, #3b82f6);
            color: #fff;
            font-weight: 600;
            padding: 14px 38px;
            border-radius: 40px;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(108, 99, 255, 0.3);
            border: none;
            cursor: pointer;
        }

        .btn-cv:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(108, 99, 255, 0.5);
        }

        /* Contact Page Specific */
        .contact-section h2 {
            font-size: 40px;
            text-align: center;
            margin-bottom: 40px;
        }

        .contact-section h2 span {
            color: #6c63ff;
        }

        .contact-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
        }

        .contact-info {
            flex: 1 1 250px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .contact-card {
            background: #1e293b;
            padding: 25px 20px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid #334155;
            transition: 0.3s;
            opacity: 0;
            transform: translateY(30px);
        }

        .contact-card.animate {
            animation: fadeUp 0.6s ease forwards;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .contact-card:hover {
            border-color: #6c63ff;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(108, 99, 255, 0.15);
        }

        .contact-card i {
            font-size: 30px;
            color: #6c63ff;
            margin-bottom: 10px;
        }

        .contact-card h4 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .contact-card p {
            color: #94a3b8;
            font-size: 14px;
        }

        .contact-form {
            flex: 2 1 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .contact-form input,
        .contact-form textarea {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px 18px;
            color: #fff;
            font-size: 15px;
            transition: 0.3s;
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            outline: none;
            border-color: #6c63ff;
            box-shadow: 0 0 15px rgba(108, 99, 255, 0.15);
        }

        .contact-form textarea {
            resize: vertical;
        }

        .contact-form .btn-cv {
            align-self: flex-start;
        }

        .form-success {
            display: none;
            background: rgba(108, 99, 255, 0.15);
            border: 1px solid #6c63ff;
            padding: 15px;
            border-radius: 10px;
            color: #a78bfa;
            text-align: center;
            margin-top: 10px;
        }

        .form-success.show {
            display: block;
            animation: fadeUp 0.5s ease;
        }

        @media (max-width: 768px) {
            .portfolio-card {
                padding: 20px;
            }
            nav {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
            .nav-links {
                gap: 15px;
            }
            .contact-section h2 {
                font-size: 32px;
            }
            .contact-info {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 480px) {
            .nav-links {
                gap: 10px;
                font-size: 14px;
            }
            .contact-info {
                grid-template-columns: 1fr;
            }
            .btn-cv {
                padding: 12px 28px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div class="portfolio-card">

        <nav>
            <div class="logo">Portfolio.</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>

        <section class="contact-section">
            <h2>Contact <span>Me</span></h2>

            <div class="contact-container">
                <div class="contact-info">
                    <div class="contact-card" data-delay="0">
                        <i class="fas fa-phone"></i>
                        <h4>Phone</h4>
                        <p>+1 234 567 890</p>
                    </div>
                    <div class="contact-card" data-delay="200">
                        <i class="fas fa-envelope"></i>
                        <h4>Email</h4>
                        <p>john@example.com</p>
                    </div>
                    <div class="contact-card" data-delay="400">
                        <i class="fas fa-map-marker-alt"></i>
                        <h4>Location</h4>
                        <p>New York, USA</p>
                    </div>
                    <div class="contact-card" data-delay="600">
                        <i class="fas fa-clock"></i>
                        <h4>Work Hours</h4>
                        <p>Mon - Fri: 9AM - 6PM</p>
                    </div>
                </div>

                <div class="contact-form">
                    <input type="text" id="name" placeholder="Your Name" required />
                    <input type="email" id="email" placeholder="Your Email" required />
                    <input type="text" id="subject" placeholder="Subject" />
                    <textarea id="message" placeholder="Your Message" rows="5" required></textarea>
                    <button type="submit" class="btn-cv" onclick="sendMessage(event)">
                        <i class="fas fa-paper-plane"></i> Send Message
                    </button>
                    <div class="form-success" id="formSuccess">
                        <i class="fas fa-check-circle"></i> Your message has been sent successfully!
                    </div>
                </div>
            </div>
        </section>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Contact Page Loaded');

            // Animate contact cards
            const contactCards = document.querySelectorAll('.contact-card');
            contactCards.forEach(card => {
                const delay = parseInt(card.getAttribute('data-delay'));
                setTimeout(() => {
                    card.classList.add('animate');
                }, delay);
            });

            // Auto-fill demo data (optional - remove in production)
            // document.getElementById('name').value = 'John Doe';
            // document.getElementById('email').value = 'john@example.com';
        });

        function sendMessage(event) {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const subject = document.getElementById('subject').value.trim();
            const message = document.getElementById('message').value.trim();

            // Validation
            if (!name || !email || !message) {
                alert('Please fill in all required fields (Name, Email, Message)');
                return;
            }

            if (!email.includes('@') || !email.includes('.')) {
                alert('Please enter a valid email address');
                return;
            }

            // Show success message
            const successDiv = document.getElementById('formSuccess');
            successDiv.classList.add('show');

            // Clear form
            document.getElementById('name').value = '';
            document.getElementById('email').value = '';
            document.getElementById('subject').value = '';
            document.getElementById('message').value = '';

            // Log the message (in real use, send to server)
            console.log('Message sent:', { name, email, subject, message });

            // Hide success after 5 seconds
            setTimeout(() => {
                successDiv.classList.remove('show');
            }, 5000);
        }

        // Add input validation real-time feedback
        document.querySelectorAll('.contact-form input, .contact-form textarea').forEach(input => {
            input.addEventListener('focus', function() {
                this.style.borderColor = '#6c63ff';
            });
            input.addEventListener('blur', function() {
                if (!this.value.trim()) {
                    this.style.borderColor = '#334155';
                }
            });
        });
    </script>

</body>
</html>
